[package]
name = "shipr-cli"
version = "0.1.0"
edition = "2024"
description = "A minimal coding harness with smart low-cost LiteLLM routing"
license = "MIT"

[[bin]]
name = "shipr"
path = "src/main.rs"

[workspace]
members = ["crates/shipr-smart-routing"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dialoguer = "0.11"
owo-colors = "4.1"
ratatui = "0.29"
shipr-smart-routing = { path = "crates/shipr-smart-routing" }
