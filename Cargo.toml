[package]
name = "routr-cli"
version = "0.1.0"
edition = "2024"
description = "A minimal coding harness with smart low-cost LiteLLM routing"
license = "MIT"

[[bin]]
name = "routr"
path = "src/main.rs"

[workspace]
members = ["crates/routr-smart-routing"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
owo-colors = "4.1"
routr-smart-routing = { path = "crates/routr-smart-routing" }
